<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/menu.css">
  <title>CSS Hamburger Menu</title>
</head>
<body>

  <div class="menu-wrap">
    <input type="checkbox" class="toggler">
    <div class="hamburger"> <div></div> </div>
    <div class="menu">
      <div>
        <div>
          <h2>Калькулятор</h2>
          <h3>Шаг 1. Добавьте товары или выберите заказ</h3>
          <div class="select">
    
            <div class="options">
              <label for="uiux" class="option">
                <input type="radio" name="role" id="uiux">
                <span>UI/UX Engineer</span>
              </label>
        
              <label for="frontend" class="option">
                <input type="radio" id="frontend" name="role">
              <span>Frontend Engineer</span>
              </label>
        
              <label for="backend" class="option">
                <input type="radio" id="backend" name="role">
              <span>Backend Engineer</span>
              </label>
        
              <label for="fullstack" class="option">
                <input type="radio" id="fullstack" name="role">
              <span>Full-Stack Engineer</span>
              </label>
        
              <label for="cto" class="option">
                <input type="radio" id="cto" name="role">
              <span>CTO</span>
              </label>
        
              <label for="dataanalyst" class="option">
                <input type="radio" id="dataanalyst" name="role">
              <span>Data Analyst</span>
              </label>
        
              <label for="itSupport" class="option">
                <input type="radio" id="itSupport" name="role">
              <span>IT Support Engineer</span>
              </label>
        
              <label for="reactNative" class="option">
                <input type="radio" id="rectNative" name="role">
              <span>React Native Developer</span>
              </label>
            </div>
            <div class="selected">Select Role</div>
            
          </div>
          
        
          
        </div>
      </div>
    </div>
  </div>

  <header class="showcase">
    <div class="container showcase-inner">
      <h1>Приветствуем!</h1>
      <p>У нас вы можете выбрать различные товары на любой вкус. Представлена широкая линейка товаров с подробным описанием в каталоге.</p>
    </div>
  </header>

  <script src="./script.js"></script>
</body>

</html>
